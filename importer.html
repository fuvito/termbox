<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TermBox — Import</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100vh;
        padding: 24px;
        color: #111827;
      }
      h2 { font-size: 15px; font-weight: 600; }
      p  { font-size: 13px; color: #6b7280; text-align: center; }
      button {
        padding: 9px 20px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #3B4BC8;
        color: #fff;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { font-size: 13px; color: #374151; min-height: 18px; }
    </style>
  </head>
  <body>
    <h2>Import Glossary</h2>
    <p>Select a CSV or JSON source pack</p>
    <input id="fileInput" type="file" accept=".csv,.json" style="display:none" />
    <button id="selectBtn">Select file…</button>
    <span id="status"></span>
    <script type="module" src="/src/importer.ts"></script>
  </body>
</html>
